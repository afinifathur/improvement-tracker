services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: improvement-tracker-app:latest
    container_name: improvement-tracker-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: ${APP_NAME:-ImprovementTracker}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:6004}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-improvement_tracker}
      DB_USERNAME: ${DB_USERNAME:-improvement}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
    volumes:
      - app-storage:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - improvement-network

  web:
    image: nginx:alpine
    container_name: improvement-tracker-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-6004}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - improvement-network

  db:
    image: mysql:8.0
    container_name: improvement-tracker-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-improvement_tracker}
      MYSQL_USER: ${DB_USERNAME:-improvement}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - improvement-network

networks:
  improvement-network:
    driver: bridge

volumes:
  dbdata:
  app-storage:
